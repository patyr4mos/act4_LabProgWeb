<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explorador de Pokémon · PokéAPI</title>
  <meta name="description" content="Miniaplicación web que consume la API REST PokéAPI con fetch y async/await.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1>Explorador de Pokémon</h1>
      <p class="sub">Datos en vivo de la API <a href="https://pokeapi.co" target="_blank" rel="noopener">PokéAPI</a>.</p>
    </div>
  </header>

  <main class="wrap">
    <section class="controls" aria-label="Búsqueda y filtros">
      <div class="field grow">
        <label for="q">Buscar Pokémon</label>
        <input id="q" type="search" placeholder="Ej. pikachu, char, 25…" autocomplete="off">
      </div>
      <div class="field">
        <label for="tipo">Tipo</label>
        <select id="tipo">
          <option value="">Todos</option>
        </select>
      </div>
      <div class="field">
        <label for="sort">Ordenar por</label>
        <select id="sort">
          <option value="id-asc">Número (menor)</option>
          <option value="id-desc">Número (mayor)</option>
          <option value="name-asc">Nombre (A–Z)</option>
          <option value="name-desc">Nombre (Z–A)</option>
        </select>
      </div>
    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <div id="feedback" class="feedback" hidden></div>

    <section id="grid" class="grid" aria-label="Lista de Pokémon"></section>

    <nav id="pager" class="pager" aria-label="Paginación" hidden>
      <button id="prev" type="button">← Anterior</button>
      <span id="page-info"></span>
      <button id="next" type="button">Siguiente →</button>
    </nav>
  </main>

  <dialog id="detail" aria-labelledby="detail-title">
    <button id="close" class="close" type="button" aria-label="Cerrar">×</button>
    <div id="detail-body"></div>
  </dialog>

  <footer class="wrap foot">
    <p>Proyecto de Laboratorio de Programación Web · HTML5, CSS3, JavaScript ES6+, Fetch API y JSON.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
